<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הדשבורד שלי</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>הדשבורד שלי</h1>
      <p class="subtitle">גיגית מחשבות + משלוחים + ביצוע</p>
    </header>

    <div class="grid">
      <!-- משימות -->
      <section class="card">
        <h2>משימות לביצוע</h2>
        <div class="input-row">
          <input type="text" id="taskInput" placeholder="הוסף משימה חדשה...">
          <button onclick="addTask()">הוסף</button>
        </div>
        <ul id="taskList" class="list"></ul>
      </section>

      <!-- רעיונות -->
      <section class="card">
        <h2>רעיונות (גיגית המחשבות)</h2>
        <div class="input-row">
          <input type="text" id="ideaInput" placeholder="זרוק רעיון חדש...">
          <button onclick="addIdea()">הוסף</button>
        </div>
        <ul id="ideaList" class="list"></ul>
      </section>
    </div>

    <!-- משלוחים ימיים -->
    <section class="card" style="margin-top: 1.5rem;">
      <h2>מעקב משלוחים ימיים (נמל אשדוד)</h2>
      <div class="input-row">
        <select id="companyInput" style="flex: 1; padding: 0.65rem 0.9rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 0.95rem;">
          <option value="">בחר חברת ספנות</option>
          <option value="OOCL">OOCL</option>
          <option value="MAERSK">MAERSK</option>
          <option value="MSC">MSC</option>
          <option value="ZIM">ZIM</option>
          <option value="YANG MING">YANG MING</option>
          <option value="GREEN">GREEN</option>
          <option value="ONE">ONE</option>
        </select>
        <input type="text" id="containerInput" placeholder="מספר מכולה">
        <button onclick="addContainer()">הוסף מכולה</button>
      </div>
      <ul id="containerList" class="list"></ul>
      <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 1rem;">בדיקה אוטומטית 3 פעמים ביום. סטטוס מתעדכן לאחר בדיקה.</p>
    </section>

    <footer>
      <p>נוצר עם Grok · רעיונות ומשלוחים מסונכרנים מהצ'אט</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
