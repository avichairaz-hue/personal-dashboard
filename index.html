<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הדשבורד שלי</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>הדשבורד שלי</h1>
      <p class="subtitle">משימות + רעיונות</p>
    </header>

    <div class="grid">
      <!-- משימות -->
      <section class="card">
        <h2>משימות</h2>
        <div class="input-row">
          <input type="text" id="taskInput" placeholder="הוסף משימה חדשה...">
          <button onclick="addTask()">הוסף</button>
        </div>
        <ul id="taskList" class="list"></ul>
      </section>

      <!-- רעיונות -->
      <section class="card">
        <h2>רעיונות</h2>
        <div class="input-row">
          <input type="text" id="ideaInput" placeholder="הוסף רעיון חדש...">
          <button onclick="addIdea()">הוסף</button>
        </div>
        <ul id="ideaList" class="list"></ul>
      </section>
    </div>

    <footer>
      <p>נוצר עם Grok · נתונים נשמרים במכשיר שלך</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
